<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
</head>
<body>
  <div class = "header" id = "header-home">
    <div class="container-fluid">
      <div class="row g-0">
        <div class="col-md-4 p-3 text-start">
          <h2>Edit Question</h2>
        </div>
        <div class="col-md p-3 text-end">
          <a href="/logout"><button type="button" class="btn btn-danger">Logout</button></a>
        </div>
      </div>
    </div>
    <hr>
  </div>
  <div class="card text-center m-4 border-1 shadow">
    <div class="card-header">
    {{question.question_stmt}}
    </div>
    <form action="/admin/{{subject_id}}/{{chapter_id}}/{{quiz_id}}/{{question_id}}/edit" method = "POST" id = "edit_question_form">
    <div class="card-body">
        <div class="container-fluid">
            <div class="row justify-content-center">
                <div class="col-md-6 mb-3">
                    <div class="card border-danger h-100 flex-fill">
                        <ul class="list-group list-group-flush">
                        {% for option in options %}
                            {% if not option.is_correct %}
                            <li class="list-group-item"><input class = "form-control" type = text value = {{option.option_text}} name = "{{option.option_id}}" from = "edit_question_form"/></li>
                            {% endif %}
                        {% endfor %}
                        </ul>
                    </div>
                </div>
                <div class="col-md-6 mb-3">
                    <div class="card border-success h-100 flex-fill">
                        <ul class="list-group list-group-flush">
                          {% for option in options %}
                              {% if option.is_correct %}
                              <li class="list-group-item"><input class = "form-control" type = text value = {{option.option_text}} name = "{{option.option_id}}" form = "edit_question_form"/></li>
                              {% endif %}
                          {% endfor %}
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="card-footer text-muted">
    <div class = "container">
        <div class = "row justify-content-center">
            <div class = "col-md-6 mb-2">
                <a href = "/admin/{{subject_id}}/{{chapter_id}}/{{quiz_id}}/{{question.question_id}}/delete"><button class = "btn btn-danger">Delete</button></a>
            </div>
            <div class = "col-md-6 mb-2">
                <a href = "/admin/{{subject_id}}/{{chapter_id}}/{{quiz_id}}/{{question.question_id}}/edit"><button class = "btn btn-primary">Edit</button></a>
            </div>
        </div>
    </div>
    </div>
</div>
</body>
</html>
