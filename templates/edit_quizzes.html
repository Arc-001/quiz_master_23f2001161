<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Quizzes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>

    <script>
        function edit_quiz(quiz_id, quiz_name, quiz_description, chapter_id, date_of_quiz, time_duration, remarks){
            console.log(quiz_id);
            console.log(quiz_name);
            console.log(quiz_description);
            document.getElementById(quiz_id).innerHTML = `
            <div class="col" id = "${quiz_id}">
                <input value = "${quiz_id}" name = "quiz_id" style = "visibility:hidden" form = "edit_quizzes"/>
                <div class="card h-100">
                    <div class="card-header bg-light">
                        ${quiz_id} ) <input type = "text" class = "form-control" name = "quiz_name" value="${quiz_name}" style = "display:inline; width: auto;" form="edit_quizzes"/>
                    </div>
                    <div class="card-body">
                        <p class="card-text">
                            <textarea type = "text" class = "form-control" name = "quiz_description" form = "edit_quizzes">${quiz_description}</textarea>
                        </p>
                        <div class="mb-3">
                            <label class="form-label">Date of Quiz</label>
                            <input type="date" class="form-control" name="date_of_quiz" value="${date_of_quiz}" form="edit_quizzes">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Time Duration</label>
                            <input type="text" class="form-control" name="time_duration" value="${time_duration}" form="edit_quizzes">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Remarks</label>
                            <input type="text" class="form-control" name="remarks" value="${remarks}" form="edit_quizzes">
                        </div>
                    </div>
                    <div class="card-footer">
                        <div class="d-flex justify-content-between align-items-center">
                            <a href="/admin/chapter/${chapter_id}"><button type="button" class="btn btn-outline-danger">Cancel</button></a>
                            <a href="/admin/quiz/${quiz_id}/delete"><button type="button" class="btn btn-danger">Delete</button></a>
                            <button type="submit" class="btn btn-primary">Confirm</button>
                        </div>
                    </div> 
                </div>
            </div>
            `;
        }
        function make_visible(){
            console.log(document.getElementById("new_quiz").style.visibility)
            
            if (document.getElementById("new_quiz").style.visibility === "hidden"){
                document.getElementById("new_quiz").style.visibility = "visible"
                console.log("did exec")
            }
        }
    </script>

</head>
<body>

    <div class="header" id="header-home">
    <div class="container-fluid">
        <div class="row g-0">
          <div class="col-md-4 p-3">
            <a href='/admin/chapter/{{chapter_id}}'>
                <button type="button" class="btn btn-outline-danger">Go back</button>
            </a>
          </div>
          <div class="col-md-4 p-3 text-center">
            <h2>Edit quizzes in {{chapter_name}}</h2>
          </div>
          <div class="col-md-4 p-3 text-end">
            <a href="/logout"><button type="button" class="btn btn-danger">Logout</button></a>
          </div>
        </div>
      </div>
      <hr>
    </div>

    <div class="container py-4">
        <form action="/admin/quiz/edit" method="post" id="edit_quizzes">
        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
            {% for quiz in quizzes %}
            <div class="col" id="{{quiz.quiz_id}}">
                <div class="card h-100">
                    <div class="card-header bg-light">
                        {{quiz.quiz_id}} ) {{quiz.name}}
                    </div>
                    <div class="card-body">
                        <p class="card-text">{{quiz.description}}</p>
                        <p><strong>Date:</strong> {{quiz.date_of_quiz}}</p>
                        <p><strong>Duration:</strong> {{quiz.time_duration}}</p>
                        <p><strong>Remarks:</strong> {{quiz.remarks}}</p>
                    </div>
                    <div class="card-footer">
                        <div class="d-flex justify-content-between align-items-center">
                            <a href="/admin/quiz/{{quiz.quiz_id}}/delete"><button type="button" class="btn btn-danger">Delete</button></a>
                            <button type="button" class="btn btn-primary" onclick="edit_quiz('{{quiz.quiz_id}}', '{{quiz.name}}','{{quiz.description}}','{{quiz.chapter_id}}', '{{quiz.date_of_quiz}}', '{{quiz.time_duration}}', '{{quiz.remarks}}')">Edit</button>
                            <a href="/admin/quiz/{{quiz.quiz_id}}/questions"><button type="button" class="btn btn-success">Questions</button></a>
                        </div>
                    </div> 
                </div>
            </div>
            {% endfor %}
        </div>
        </form>
    </div>
    <div class="d-grid col-6 mx-auto">
        <button class="btn btn-outline-primary" type="button" onclick="make_visible()">Add quiz</button>
    </div>
    <div id="new_quiz" style="visibility: hidden;">
        <form action="/admin/chapter/{{chapter_id}}/quiz/add" method="post" id="new_quiz_form">
            <div class="container-fluid px-3 py-4">
                <div class="row- mx-auto">
                    <div class="col- mx-auto">
                        <label class="form-label" for="name">Name of quiz</label>
                        <input class="form-control" id="name" name="quiz_name" placeholder="Name of the quiz" form="new_quiz_form"/>
                        <label class="form-label pt-4" for="description">Description of the quiz</label>
                        <input class="form-control" id="description" name="quiz_description" placeholder="Description of the quiz" form="new_quiz_form"/>
                        <label class="form-label pt-4" for="date">Date of Quiz</label>
                        <input class="form-control" id="date" name="date_of_quiz" type="date" form="new_quiz_form"/>
                        <label class="form-label pt-4" for="duration">Time Duration</label>
                        <input class="form-control" id="duration" name="time_duration" placeholder="in minutes eg. (30) " form="new_quiz_form"/>
                        <label class="form-label pt-4" for="remarks">Remarks</label>
                        <input class="form-control" id="remarks" name="remarks" placeholder="Any additional remarks" form="new_quiz_form"/>
                    </div>
                </div>
                <div class="row py-4 mx-auto">
                    <div class="col-6 align-items-center g-2">
                        <a href="/admin/chapter/{{chapter_id}}"><button class="btn btn-primary" type="button">Cancel</button></a>
                        <button class="btn btn-primary" type="submit" form="new_quiz_form">Submit</button>
                    </div>
                </div>
            </div>
        </form>
    </div>
</body>
</html>
