<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>

    <head>
        <style>
            .form-control:focus {
                border-color: #86b7fe;
                box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
                transition: all 0.3s ease-in-out;
            }
            
            .form-control:hover {
                border-color: #86b7fe;
                box-shadow: 0 0 5px rgba(13, 110, 253, 0.2);
            }
        </style>
    </head>
</head>

<body>

    <div class="header" id="header-home">
        <div class="container-fluid">
            <div class="row g-0">
                <div class="col-md-4 p-3">
                    <a href='/'>
                        <button type="button" class="btn btn-outline-info">Go Back</button>
                    </a>
                </div>
                <div class="col-md-4 p-3 text-center">
                    <h1>Register</h1>
                </div>
            </div>
        </div>
        <hr>
    </div>
    <form action = '/register' method = 'post' id = 'reg'>
    <div class="container">
        <div class="row min-vh-100 d-flex align-items-center border rounded shadow p-4 bg-light text-dark border">

            <!-- <div class="col-md-6"> -->
            <div class="col-">
                <label for="email" class="form-label">Email</label>
                <input type="email" name = "email" class="form-control" id="email" placeholder="john_doe@email.com" required>
            </div>

            <div class="col-sm-6">
                <lable for="full_name" class="form-label">Full Name</lable>
                <input type="text" name = "full_name" class="form-control" id="full_name" placeholder="John Doe" required>
            </div>
            
            <div class="col-sm-6">
                <lable for="username" class="form-label">Username</lable>
                <input type="text" name = "username" class="form-control" id="username" placeholder="70hn_D0e" required>
            </div>


            <div class="col-md-12">
                <label for="qualification" class="form-label">Qualification</label>
                <select class="form-select" name="qualification" id="qualification" required>
                    <option value="" disabled selected>Select your qualification</option>
                    <option value="No formal education">No formal education</option>
                    <option value="Primary Education">Primary Education</option>
                    <option value="Secondory Education">Secondory Education</option>
                    <option value="Bachelor's degree">Bachelor's degree</option>
                    <option value="Master's degree">Master's degree</option>
                    <option value="PhD">PhD</option>
                </select>
            </div>

            <div class="col-6 rounded">
                <label for="password_1" class="form-label">Password</label>
                <input type="password" name = "password" class="form-control" id="password_1" placeholder="password" required>
            </div>

            <div class="col-6 rounded align-items-center">
                <labe for="password_2" class="form-label">Confirm Password</label>
                    <input type="password" name = "password_check" class="form-control" id="password_2" placeholder="password" required>
            </div>

            <div class="col-12">
                <label for="additional_info" class="form-label">Qualification info</label>
                <input type="text" class="form-control" name = "qualification_info" id="additional_info" placeholder="Btech in Computer Science">
            </div>
        
            <div class="col-12">
                <label for="datepicker" class="form-label">Date of Birth</label>
                <input type="text" class="form-control" id="datepicker" name = "DOB" placeholder="Date of Birth" required>
            </div>
            <div class="col-12 mt-4 rounded">
                <button type="submit" class="btn btn-primary">Register</button>
            </div>
        </div>
      </form>


            <script src="https://code.jquery.com/jquery-3.6.1.min.js" integrity="sha256-o88AwQnZB+VDvE9tvIXrMQaPlFFSUTR+nldQm1LuPXQ=" crossorigin="anonymous">
            </script>
            <script>
                $(function () {
                    $("#datepicker").datepicker({ 
                        autoclose: true, 
                        todayHighlight: true,
                    }).datepicker('update', new Date());
                });
            </script>
            <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous">
            </script>
            <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous">
            </script>
            <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.9.0/js/bootstrap-datepicker.min.js">
            </script>
</body>

</html>
