<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>

</head>
<body>
    <div class = "header" id = "header-home">
        <div class="container-fluid">
            <div class="row g-0">
              <div class="col-md-4 p-3">
                <a href = '/home'>
                    <button type="button" class="btn btn-outline-info">Go to home</button>
                </a>
              </div>
              <div class="col-md-4 p-3 text-center">
                {{name}}
                </div>
              <div class="col-md-4 p-3 text-end">
                <a href="/logout"><button type="button" class="btn btn-outline-danger">Logout</button></a>
              </div>
            </div>
          </div>
          <hr>
        </div>

    <div class = "container-fluid mt-3">
        <div class = "row">
            <div class = "col d-flex justify-content-center">
                <img src = "/user/{{quiz_id}}/{{attempt_id}}/get_pi_fig" class = "border-1"/>
            </div>
        </div>
    </div>


        <div class = "row">
            <div class = "row">
                <div class="col d-flex justify-content-center bg-secondary-subtle rounded">
                    <p>Wrong selections</p>
                </div>
            </div>
            <div class = "col- d-flex justify-content-center">
                {% for question in questions %}
                <div class="card h-100 flex-fill m-2 shadow-sm">
                    <div class="card-header bg-primary-subtle">
                        {{question}}
                    </div>
                    <div class="card-body bg-danger-subtle md-2">
                        <p class="card-text"><strong>Wrong: </strong> {{questions[question][0]}}</p>
                    </div>
                    <div class="card-footer bg-success-subtle md-2">
                        <p class="card-text"><strong>Correct: </strong>{{questions[question][1]}}</p>
                    </div> 
                </div>
                {% endfor %}
            </div>
            </div>
        </div>
</body>
</html>
