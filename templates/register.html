    <style>
        .form-control:focus {
            border-color: #86b7fe;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
            transition: all 0.3s ease-in-out;
        }
        
        .form-control:hover {
            border-color: #86b7fe;
            box-shadow: 0 0 5px rgba(13, 110, 253, 0.2);
        }
    </style>

<body>

    <div class = "header" id = "header-home">
        <div class="container-fluid">
            <div class="row g-0">
              <div class="col-md-4 p-3">
                <a href = '/'>
                    <button type="button" class="btn btn-outline-info">Go Back</button>
                </a>
              </div>
              <div class="col-md-4 p-3 text-center">
                <h1>Register</h1>
                </div>
            </div>
          </div>
          <hr>
        </div>

    <div class="container py-6">
        <div class="row min-vh-100 d-flex align-items-center border rounded shadow">
            
            <!-- <div class="col-md-6"> -->
            <div class = "col-md-6 p-4 rounded">
                <label for="inputEmail4" class="form-label">Email</label>
                <input type="email" class="form-control" id="inputEmail4" placeholder="john_doe@email.com" required>
            </div>

            <div class = "col-md-6">
                <lable for = "full_name" class = "form-label">Full Name</lable>
                <input type = "text" class = "form-control" id = "full_name" placeholder="John Doe" required>
              </div>
            
            
            <div class="col-md-6">
                <label for="inputPassword4" class="form-label">Password</label>
                <input type="password" class="form-control" id="inputPassword4" placeholder="password" required>
            </div>
              
              <div class="col-12">
                <label for="inputAddress" class="form-label">Address</label>
                <input type="text" class="form-control" id="inputAddress" placeholder="1234 Main St">
              </div>
              <div class="col-12">
                <label for="inputAddress2" class="form-label">Address 2</label>
                <input type="text" class="form-control" id="inputAddress2" placeholder="Apartment, studio, or floor">
              </div>
              <div class="col-md-6">
                <label for="inputCity" class="form-label">City</label>
                <input type="text" class="form-control" id="inputCity">
              </div>
              <div class="col-md-4">
                <label for="inputState" class="form-label">State</label>
                <select id="inputState" class="form-select">
                  <option selected>Choose...</option>
                  <option>...</option>
                </select>
              </div>
              <div class="col-md-2">
                <label for="inputZip" class="form-label">Zip</label>
                <input type="text" class="form-control" id="inputZip">
              </div>
              <div class="col-12">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="gridCheck">
                  <label class="form-check-label" for="gridCheck">
                    Check me out
                  </label>
                </div>
              </div>

              <div class="form-group">
                <label for="exampleFormControlInput1">Email address</label>
                <input type="email" class="form-control" id="exampleFormControlInput1" placeholder="name@example.com">
              </div>
              <div class="form-group">
                <label for="exampleFormControlSelect1">Example select</label>
                <label for="exampleFormControlTextarea1">Example textarea</label>
              <label>Select Date: </label>
              <div id="datepicker" 
                   class="input-group date" 
                   data-date-format="mm-dd-yyyy">
                  <input class="form-control" 
                         type="text" readonly />
                  <span class="input-group-addon">
                      <i class="glyphicon glyphicon-calendar"></i>
                  </span>
              </div>

              <div class="col-12">
                <button type="submit" class="btn btn-primary">Sign in</button>
              </div>
            </form>
          <form>
        </div>

    <script>
        $(function () {
            $("#datepicker").datepicker({ 
                autoclose: true, 
                todayHighlight: true,
            }).datepicker('update', new Date());
        });
    </script>
