<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
    <script>
        function timer(){
            let sec = 0;
            let min = 0;
            setInterval(()=>{
                document.getElementById('timer').innerHTML = `
                <button class = "btn btn-primary">${min}mm:${sec}ss</button>
                `;
                sec++;
                if (sec == 60){
                    sec = 0;
                    min++;
                }
                if (min == {{quiz.time_duration}}){
                  document.querySelector([form[id = "transcript"]]).submit()
                }
            },1000)
        }
    </script>
    <style>
        .sticky-sidebar {
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;

            }
        .question-link .list-group-item{
          transition: all 0.2s ease;
        }
        .question-link:hover  .list-group-item{
          background-color: #e3e6e4;
          color: black;
          font-weight: bold;
          transform: scale(1.05);
        }
    </style>
</head>
<body>
  <nav class="container-fluid bg-light py-4 px-2">
    <div class="row align-items-center">
      <div class="col-10">
        <div class="progress" id = "progress_bar">
          <div class="progress-bar progress-bar-striped progress-bar-animated" 
               role="progressbar" aria-valuenow="75" aria-valuemin="0" 
               aria-valuemax="100" style="width: 75%"></div>
        </div>
      </div>
      <div class="col-2 d-flex justify-content-center">
        <div id="timer" class="text-end">
          Starting timer
        </div>
      </div>
    </div>
  </nav>
  <form action = "/user/{{subject_id}}/{{chapter_id}}/{{quiz_id}}" method = "POST" id = "transcript">
    <div class="container">
        <div class="row">
          <!-- Main content/ questions -->
          <div class="col-8 py-1" id="main">
            {% for question in quiz.question %}
            <div class="card border-1 mb-3" id = "question-{{question.question_id}}">
              <div class="card-header">
                
                {{loop.index}} ) {{question.question_stmt}}
                
              </div>
              <div class="card-body">
                {% for option in question.option %}
                <div class="form-check form-check">
                  <input class="form-check-input" type="radio" name="{{option_id}}" id="{{option_id}}" value="test?" form = "transcript" >
                  <label class="form-check-label" for="{{option_id}}">{{option.option_text}}</label>
                </div>
                {% endfor %}
              </div>
            </div>
            {% endfor %}
          </div>
          <div class="col-4 sticky-sidebar" id="Sidebar">
              <div class = "row">
                <div class = "col d-flex justify-content-center">
                  <div class="card flex-fill">
                    <ul class="list-group list-group-flush justify-content-center text-center">

                      {% for question in quiz.question %}
                        <a href="#question-{{question.question_id}}" class="question-link" style="text-decoration: none;">
                          <li class="list-group-item">
                          {{loop.index}}
                        </li></a>
                      {% endfor %}
                    </ul>
                  </div>
                </div>
              </div>
              <div class = "row">
                <div class="col d-flex justify-content-center">
                <button class = "btn btn-primary flex-fill">submit</button>
                </div>
              </div>
          </div>
        </div>
      </div>
    </form> 
    <script>timer()</script>
      
</body>
</html>
