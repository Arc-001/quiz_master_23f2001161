<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>

    <script>
        function show_form(){
            document.getElementById("add_usr").innerHTML = `
            <form action = '/admin/add_user' method = 'post' id = 'reg'>
    <div class="container">
        <div class="row align-items-left rounded bg-light text-dark border">

            <!-- <div class="col-md-6"> -->
            <div class="col- mt-4">
                <label for="email" class="form-label">Email</label>
                <input type="email" name = "email" class="form-control" id="email" placeholder="john_doe@email.com" required>
            </div>


            <div class="col-sm">
                <label for="full_name" class="form-label">Full Name</label>
                <input type="text" name = "full_name" class="form-control" id="full_name" placeholder="John Doe" required>
            </div>

            <div class="col-sm">
                <label for="username" class="form-label">Username</label>
                <input type="text" name = "username" class="form-control" id="username" placeholder="70hn_D0e" required>
            </div>
            

            <div class="col-md">
                <label for="qualification" class="form-label">Qualification</label>
                <select class="form-select" name="qualification" id="qualification" required>
                    <option value="" disabled selected>Select your qualification</option>
                    <option value="No formal education">No formal education</option>
                    <option value="Primary Education">Primary Education</option>
                    <option value="Secondory Education">Secondory Education</option>
                    <option value="Bachelor's degree">Bachelor's degree</option>
                    <option value="Master's degree">Master's degree</option>
                    <option value="PhD">PhD</option>
                </select>
            </div>

            <div class="col-sm">
                <label for="password_1" class="form-label">Password</label>
                <input type="password" name = "password" class="form-control" id="password_1" placeholder="password" required>
            </div>

            <div class="col-12">
                <label for="additional_info" class="form-label">Qualification info</label>
                <input type="text" class="form-control" name = "qualification_info" id="additional_info" placeholder="Btech in Computer Science">
            </div>
        
            <div class="col-12">
                <label for="datepicker" class="form-label">Date of Birth</label>
                <input type="text" class="form-control" id="datepicker" name = "DOB" placeholder="Date of Birth" required>
            </div>
            <div class="col-12 p-4 rounded">
                <a href = "/admin/edit_users"><button type="submit" class="btn btn-primary">Register</button></a>
            </div>
        </div>
      </form>
            `
        }

    </script>

</head>
<body>
    <div class = "header" id = "header-home">
        <div class="container-fluid">
            <div class="row g-0">
              <div class="col-md-4 p-3">
                <a href = '/admin/home'>
                    <button type="button" class="btn btn-outline-danger">Go back</button>
                </a>
              </div>
              <div class="col-md-4 p-3 text-center">
                <h2>Edit Users</h2>
                </div>
              <div class="col-md-4 p-3 text-end">
                <a href="/logout"><button type="button" class="btn btn-outline-danger">Logout</button></a>
              </div>
            </div>
          </div>
          <hr>
        </div>
        

        <table class="table">
            <thead class="thead-dark">
              <tr>
                <th scope="col">User Id</th>
                <th scope="col">Full Name</th>
                <th scope="col">User Name</th>
                <th scope="col">Email</th>
                <th scope="col">Password</th>
                <th scope="col">Date Of Birth</th>
                <th scope="col">Qualification</th>
            </tr>
            </thead>
            <tbody>
                {% for i in Users%}
                <tr>
                    <th scope="row">{{i.user_id}}</th>
                    <td>{{i.full_name}}</td>
                    <td>{{i.username}}</td>
                    <td>{{i.email}}</td>
                    <td>{{i.password}}</td>
                    <td>{{i.date_of_birth}}</td>
                    <td>{{i.qualification}}</td>
                </tr>
                {% endfor%}
            </tbody>
          </table>

        <button type="button mt-4" class="btn btn-primary" onclick = "show_form()">Add User +</button>
        <form id = "add_usr"></form>
</body>
</html>
